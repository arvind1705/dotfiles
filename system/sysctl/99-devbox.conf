# Devbox Performance & Latency Tuning for Low-Power HDD Server
#
# 1. Lower swappiness to keep active working sets in RAM; only swap under real pressure (>90% full)
vm.swappiness = 10

# 2. Retain directory and inode caches longer in RAM on mechanical hard drives
vm.vfs_cache_pressure = 50

# 3. Smooth background dirty writeout to avoid heavy disk flushing stalls
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5
