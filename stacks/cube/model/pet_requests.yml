# PET requests: membership matches the loader's `pet_requests` query.
# Every source column comes from the generated base (columns/), under its own
# name; this cube adds membership, scope, normalization and flags.
cubes:
  - name: pet_requests
    # Results are cached until the source rows or the scope tables change
    # (checked every minute).
    refresh_key:
      every: 1 minute
      sql: "SELECT COUNT(*), MAX(updated_at), (SELECT COUNT(*) || '|' || MAX(updated) FROM public.account_count_summary), (SELECT COUNT(*) FILTER (WHERE is_active) || '|' || MAX(id) FROM public.device_account_mapping) FROM public.petdata_30d"
    extends: pet_request_columns
    public: true
    sql: >
      SELECT
        p.*,
        -- Normalization and state sets are the semantic layer rules
        -- (globals.py, generated from its TTL).
        {{ normalize('p.severity', 'Severity') | safe }} AS severity_norm,
        {{ in_set('p.state', 'PETRequestOpenStates') | safe }} AS is_open_flag,
        {{ lifecycle('p.state', 'PETRequestFinishedStates', 'PETRequestCancelledStates') | safe }} AS lifecycle,
        {{ scope_account('p', 'sub_account,site') | safe }} AS scope_account_id,
        {{ scope_accounts('p', 'sub_account,site') | safe }} AS scope_accounts,
        -- Linked to a case: the column the loader's belongsToCase edge comes from.
        NULLIF(TRIM(p.case_number), '') IS NOT NULL AS in_case_flag
      FROM public.petdata_30d p
      {{ scope_joins('p', 'petdata_30d', 'requested_item_number', 'sub_account,site', 'serial_number') | safe }}

    joins:
      - name: sla
        relationship: one_to_many
        sql: "{CUBE}.requested_item_number = {sla}.task_id"

      - name: pet_request_sla
        relationship: one_to_one
        sql: "{CUBE}.requested_item_number = {pet_request_sla}.task_id"

    measures:
      - name: count
        type: count

      - name: open_count
        type: count
        filters:
          - sql: "{CUBE}.is_open_flag"

      # Creation time as epoch seconds; ticket aging derives the mean and
      # maximum age from these and the caller's "now".
      - name: avg_created_epoch
        type: avg
        sql: "EXTRACT(EPOCH FROM {CUBE}.created_at)"

      - name: min_created_epoch
        type: min
        sql: "EXTRACT(EPOCH FROM {CUBE}.created_at)"

    dimensions:
      # Ticket key shared by every ticket cube (here the requested item number).
      - { name: ticketNumber, sql: requested_item_number, type: string }
      - { name: stateKey, sql: "LOWER(REPLACE(TRIM({CUBE}.state), '_', ' '))", type: string }
      - { name: is_open, sql: is_open_flag, type: boolean }
      - { name: isInCase, sql: in_case_flag, type: boolean }
      # finished, cancelled or other (the layer's finished/cancelled state sets).
      - { name: lifecycle, sql: lifecycle, type: string }
      # Unrecognized severities are dropped, as the loader does today.
      - { name: severityNorm, sql: severity_norm, type: string }
      # Every account that may see the ticket, as ,hex(A),hex(B), (queryRewrite
      # matches each caller account). Scope input only, never selected.
      - { name: scopeAccounts, sql: scope_accounts, type: string }
      - { name: scopeAccountId, sql: scope_account_id, type: string }
      # Lower-cased keys for case-insensitive equality filters.
      - name: vendorKey
        sql: "LOWER(TRIM({CUBE}.vendor))"
        type: string
      # Creation age bucket and staleness by the database clock; the producer
      # reads them only when its clock is the real one (no frozen MOCK_NOW).
      - name: ageBucket
        sql: "{{ age_bucket('{CUBE}.created_at') | safe }}"
        type: string
      - name: isStale72h
        sql: "{{ older_than('{CUBE}.updated_at', 72) | safe }}"
        type: boolean
      - name: isUnassigned
        sql: "NULLIF(TRIM({CUBE}.assigned_to), '') IS NULL"
        type: boolean
      - name: hasAssignmentGroup
        sql: "NULLIF(TRIM({CUBE}.assignment_group), '') IS NOT NULL"
        type: boolean
      # Sort helpers: missing values sort last in both directions, as in Dgraph.
      - { name: createdAtMissing, sql: "{CUBE}.created_at IS NULL", type: boolean }
      - { name: updatedAtMissing, sql: "{CUBE}.updated_at IS NULL", type: boolean }
      - { name: severityMissing, sql: "{CUBE}.severity_norm IS NULL", type: boolean }
      - { name: stateMissing, sql: "NULLIF(TRIM({CUBE}.state), '') IS NULL", type: boolean }
      - { name: issueTypeMissing, sql: "NULLIF(TRIM({CUBE}.issue_type), '') IS NULL", type: boolean }
