# Change requests: membership matches the loader's `change_request` query.
# Every source column comes from the generated base (columns/), under its own
# name; this cube adds membership, scope, normalization and flags.
cubes:
  - name: change_requests
    # Results are cached until the source rows or the scope tables change
    # (checked every minute).
    refresh_key:
      every: 1 minute
      sql: "SELECT COUNT(*), MAX(updated_at), (SELECT COUNT(*) || '|' || MAX(updated) FROM public.account_count_summary), (SELECT COUNT(*) FILTER (WHERE is_active) || '|' || MAX(id) FROM public.device_account_mapping) FROM public.change_request_30d"
    extends: change_request_columns
    public: true
    sql: >
      SELECT
        cr.*,
        -- Normalization and state sets are the semantic layer rules
        -- (globals.py, generated from its TTL).
        {{ normalize('cr.priority', 'TicketPriority') | safe }} AS priority_norm,
        {{ in_set('cr.state', 'ChangeRequestOpenStates') | safe }} AS is_open_flag,
        {{ lifecycle('cr.state', 'ChangeRequestFinishedStates', 'ChangeRequestCancelledStates') | safe }} AS lifecycle,
        {{ scope_account('cr', 'sub_account,site,sub_site') | safe }} AS scope_account_id,
        {{ scope_accounts('cr', 'sub_account,site,sub_site') | safe }} AS scope_accounts,
        -- Linked to a case: the column the loader's belongsToCase edge comes from.
        NULLIF(TRIM(cr.case_number), '') IS NOT NULL AS in_case_flag
      FROM public.change_request_30d cr
      {{ scope_joins('cr', 'change_request_30d', 'change_request_number', 'sub_account,site,sub_site', 'device_id') | safe }}
      WHERE cr.is_impacted_store_active

    joins:
      - name: sla
        relationship: one_to_many
        sql: "{CUBE}.change_request_number = {sla}.task_id"

      - name: change_request_sla
        relationship: one_to_one
        sql: "{CUBE}.change_request_number = {change_request_sla}.task_id"

    measures:
      - name: count
        type: count

      - name: open_count
        type: count
        filters:
          - sql: "{CUBE}.is_open_flag"

      # Creation time as epoch seconds; ticket aging derives the mean and
      # maximum age from these and the caller's "now".
      - name: avg_created_epoch
        type: avg
        sql: "EXTRACT(EPOCH FROM {CUBE}.created_at)"

      - name: min_created_epoch
        type: min
        sql: "EXTRACT(EPOCH FROM {CUBE}.created_at)"

    dimensions:
      # Ticket key shared by every ticket cube (here the change request number).
      - { name: ticketNumber, sql: change_request_number, type: string }
      - { name: stateKey, sql: "LOWER(REPLACE(TRIM({CUBE}.state), '_', ' '))", type: string }
      - { name: is_open, sql: is_open_flag, type: boolean }
      - { name: isInCase, sql: in_case_flag, type: boolean }
      # finished, cancelled or other (the layer's finished/cancelled state sets).
      - { name: lifecycle, sql: lifecycle, type: string }
      - { name: priorityNorm, sql: priority_norm, type: string }
      - name: isPostponed
        sql: "NULLIF({CUBE}.postpone, '')::boolean"
        type: boolean
      # Closure outcome from the close notes, same rules as the MCP filter
      # today. Evaluated per row inside the scoped query; needs no index.
      - name: closureOutcome
        sql: >
          CASE
            WHEN {CUBE}.close_notes ILIKE 'successful%' THEN 'successful'
            WHEN {CUBE}.close_notes IN ('Unsuccessful', 'Abandoned') THEN 'failed'
            WHEN {CUBE}.close_notes = 'Withdrawn' THEN 'rollback'
          END
        type: string
      # Every account that may see the ticket, as ,hex(A),hex(B), (queryRewrite
      # matches each caller account). Scope input only, never selected.
      - { name: scopeAccounts, sql: scope_accounts, type: string }
      - { name: scopeAccountId, sql: scope_account_id, type: string }
      # Lower-cased keys for case-insensitive equality filters.
      - name: categoryKey
        sql: "LOWER(TRIM({CUBE}.category))"
        type: string
      - name: changeTypeKey
        sql: "LOWER(TRIM({CUBE}.type))"
        type: string
      # Creation age bucket and staleness by the database clock; the producer
      # reads them only when its clock is the real one (no frozen MOCK_NOW).
      - name: ageBucket
        sql: "{{ age_bucket('{CUBE}.created_at') | safe }}"
        type: string
      - name: isStale72h
        sql: "{{ older_than('{CUBE}.updated_at', 72) | safe }}"
        type: boolean
      - name: isUnassigned
        sql: "NULLIF(TRIM({CUBE}.assigned_to), '') IS NULL"
        type: boolean
      - name: hasAssignmentGroup
        sql: "NULLIF(TRIM({CUBE}.assignment_group), '') IS NOT NULL"
        type: boolean
      # Sort helpers: missing values sort last in both directions, as in Dgraph.
      - { name: createdAtMissing, sql: "{CUBE}.created_at IS NULL", type: boolean }
      - { name: updatedAtMissing, sql: "{CUBE}.updated_at IS NULL", type: boolean }
      - { name: priorityMissing, sql: "NULLIF(TRIM({CUBE}.priority), '') IS NULL", type: boolean }
      - { name: stateMissing, sql: "NULLIF(TRIM({CUBE}.state), '') IS NULL", type: boolean }
      - { name: categoryMissing, sql: "NULLIF(TRIM({CUBE}.category), '') IS NULL", type: boolean }
      - { name: issueTypeMissing, sql: "NULLIF(TRIM({CUBE}.issue_type), '') IS NULL", type: boolean }
