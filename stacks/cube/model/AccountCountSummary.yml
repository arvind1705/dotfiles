cubes:
  - name: AccountCountSummary
    sql_table: public.account_count_summary

    measures:
      - name: count
        type: count

      - name: totalDeviceUp
        sql: device_up
        type: sum

      - name: totalDeviceDown
        sql: device_down
        type: sum

      - name: totalIncidents
        sql: incidents
        type: sum

      - name: totalAlerts
        sql: alerts
        type: sum

    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true

      - name: accountId
        sql: account_id
        type: string

      - name: accountName
        sql: account_name
        type: string

      - name: siteName
        sql: site_name
        type: string

      - name: overallHealth
        sql: overall_health
        type: string

      - name: caseCheck
        sql: case_check
        type: boolean
