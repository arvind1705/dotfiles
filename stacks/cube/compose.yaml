name: cube

services:
  cube:
    image: cubejs/cube@sha256:ac8668c5a6f81836c0a5f95a19632034d05c8c9e696a1d6c53a399bab82904f9
    container_name: cube-core
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # The HTTP API is reached through Caddy; keep the direct listener local.
      - "127.0.0.1:${CUBE_API_PORT:-4000}:4000"
      # Cube SQL remains available to the LAN for trusted SQL clients.
      - "${LAN_IP:-192.168.0.172}:${CUBE_SQL_PORT:-15432}:15432"
    volumes:
      - .:/cube/conf
    mem_reservation: 256M
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(\"http://127.0.0.1:4000/readyz\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 5s
    networks:
      - ai-infra-local

networks:
  ai-infra-local:
    external: true
