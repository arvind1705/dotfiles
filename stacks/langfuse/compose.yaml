name: aruba-langfuse
services:
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    restart: unless-stopped
    env_file:
      - ./langfuse.env
    networks:
      - ai-infra-local

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: unless-stopped
    environment:
      HOSTNAME: "0.0.0.0"
    env_file:
      - ./langfuse.env
    ports:
      - "${LAN_IP:-192.168.0.172}:3005:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/public/health"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 40s
    networks:
      - ai-infra-local

networks:
  ai-infra-local:
    external: true
