name: aruba-langfuse
services:
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    restart: unless-stopped
    environment:
      NODE_OPTIONS: "--max-old-space-size=640"
    env_file:
      - ./langfuse.env
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 896M
    networks:
      - ai-infra-local

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: unless-stopped
    environment:
      HOSTNAME: "0.0.0.0"
      NODE_OPTIONS: "--max-old-space-size=1024"
    env_file:
      - ./langfuse.env
    ports:
      - "${LAN_IP:-192.168.0.172}:3005:3000"
    deploy:
      resources:
        limits:
          cpus: '1.25'
          memory: 1536M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/public/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
      start_interval: 10s
    networks:
      - ai-infra-local

networks:
  ai-infra-local:
    external: true
