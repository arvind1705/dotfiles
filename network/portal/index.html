<meta charset="UTF-8">

<style>
:root {
  --bg-app: #0b0f17;
  --bg-card: #131926;
  --bg-card-hover: #1a2234;
  --bg-subtle: rgba(255, 255, 255, 0.04);
  --bg-subtle-hover: rgba(255, 255, 255, 0.08);
  --border: rgba(255, 255, 255, 0.08);
  --border-hover: rgba(99, 102, 241, 0.5);

  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-tertiary: #64748b;

  --accent: #6366f1;
  --accent-subtle: rgba(99, 102, 241, 0.12);
  --success: #10b981;
  --success-subtle: rgba(16, 185, 129, 0.12);
  --warning: #f59e0b;
  --warning-subtle: rgba(245, 158, 11, 0.12);
  --danger: #ef4444;
  --danger-subtle: rgba(239, 68, 68, 0.12);

  --radius-sm: 6px;
  --radius: 10px;
  --radius-pill: 9999px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

[data-theme="light"] {
  --bg-app: #f8fafc;
  --bg-card: #ffffff;
  --bg-card-hover: #f1f5f9;
  --bg-subtle: rgba(0, 0, 0, 0.03);
  --bg-subtle-hover: rgba(0, 0, 0, 0.06);
  --border: rgba(0, 0, 0, 0.08);
  --border-hover: rgba(99, 102, 241, 0.5);

  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-tertiary: #94a3b8;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font);
  background-color: var(--bg-app);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 24px 20px;
  transition: background-color 0.2s ease, color 0.2s ease;
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 980px;
  width: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* Header */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  background: var(--accent);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}

.brand-title {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.ip-badge {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 2px 7px;
  border-radius: var(--radius-sm);
  background: var(--bg-subtle);
  color: var(--text-secondary);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.15s ease;
}
.ip-badge:hover {
  background: var(--bg-subtle-hover);
  color: var(--text-primary);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Compact Telemetry Micro-Bar */
.stats-bar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 500;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-secondary);
}

.stat-pill.online {
  background: var(--success-subtle);
  color: var(--success);
  border-color: rgba(16, 185, 129, 0.25);
}
.stat-pill.warning {
  background: var(--warning-subtle);
  color: var(--warning);
  border-color: rgba(245, 158, 11, 0.3);
}
.stat-pill.offline {
  background: var(--danger-subtle);
  color: var(--danger);
  border-color: rgba(239, 68, 68, 0.25);
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background-color: currentColor;
}

/* Icon Buttons */
.btn-icon {
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s ease;
}
.btn-icon:hover {
  background: var(--bg-card-hover);
  color: var(--text-primary);
  border-color: var(--border-hover);
}

/* Search Bar */
.search-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.search-wrap {
  position: relative;
  flex: 1;
}

.search-wrap svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-tertiary);
}

.search-input {
  width: 100%;
  padding: 8px 36px 8px 34px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-primary);
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s ease;
}
.search-input:focus {
  border-color: var(--accent);
}

.search-kbd {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 2px 5px;
  border-radius: 4px;
  background: var(--bg-subtle);
  color: var(--text-tertiary);
  border: 1px solid var(--border);
}

.filter-pills {
  display: flex;
  gap: 6px;
}

.filter-btn {
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 500;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s ease;
}
.filter-btn:hover {
  color: var(--text-primary);
}
.filter-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* Category Sections */
.section-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-tertiary);
  margin-top: 6px;
  margin-bottom: 8px;
}

/* Service Grid & Cards */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}

.card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-radius: var(--radius);
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-primary);
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
  text-align: left;
}

.card:hover {
  border-color: var(--border-hover);
  background: var(--bg-card-hover);
  transform: translateY(-1px);
}

.card-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.card-icon {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  background: var(--bg-subtle);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-primary);
  flex-shrink: 0;
}
.card-icon svg {
  width: 17px;
  height: 17px;
}

.card-text {
  min-width: 0;
}

.card-name {
  font-size: 13.5px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-meta {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}

.card-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  margin-left: 8px;
}

.card-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background-color: var(--text-tertiary);
  transition: background-color 0.2s ease;
}
.card-dot.online {
  background-color: var(--success);
  box-shadow: 0 0 6px rgba(16, 185, 129, 0.4);
}
.card-dot.offline {
  background-color: var(--danger);
}

.card-action {
  font-size: 12px;
  color: var(--text-tertiary);
  opacity: 0.6;
  transition: opacity 0.15s ease, transform 0.15s ease;
}
.card:hover .card-action {
  opacity: 1;
  color: var(--accent);
  transform: translateX(1px);
}

/* Toast */
.toast-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 999;
}
.toast {
  background: #1e293b;
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.15);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 500;
  animation: toastAnim 0.2s ease forwards;
}
@keyframes toastAnim {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Footer */
footer {
  margin-top: auto;
  padding-top: 18px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11.5px;
  color: var(--text-tertiary);
}
footer a {
  color: var(--text-secondary);
  text-decoration: none;
}
footer a:hover {
  color: var(--accent);
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}
</style>

let isProbing = false;

function updateOverallStatus() {
  const pill = document.getElementById('status-pill');
  const txt = document.getElementById('status-text');
  if (!pill || !txt) return;

  const total = SERVICES.length;
  let onlineCount = 0;
  let knownCount = 0;

  for (const s of SERVICES) {
    const h = healthMap[s.id];
    if (h && (h.status === 'online' || h.status === 'offline')) {
      knownCount++;
      if (h.status === 'online') onlineCount++;
    }
  }

  if (knownCount === 0) {
    pill.className = 'stat-pill';
    txt.innerText = 'Probing...';
    return;
  }

  pill.removeAttribute('style');
  if (onlineCount === total) {
    pill.className = 'stat-pill online';
    txt.innerText = `All ${total} Online`;
  } else if (onlineCount > 0) {
    pill.className = 'stat-pill warning';
    txt.innerText = `${onlineCount}/${total} Online`;
  } else {
    pill.className = 'stat-pill offline';
    txt.innerText = 'Offline';
  }
}

function render() {
  const root = document.getElementById('services-root');
  const filtered = SERVICES.filter(s => {
    const matchCat = currentCat === 'all' || s.cat === currentCat;
    const q = searchFilter.toLowerCase().trim();
    const matchQ = !q || s.name.toLowerCase().includes(q) || s.meta.toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  if (filtered.length === 0) {
    root.innerHTML = `<div style="text-align:center; padding:32px 0; color:var(--text-tertiary); font-size:13px;">No services found</div>`;
    return;
  }

  const sections = [
    { id: 'web', title: 'Web Applications' },
    { id: 'api', title: 'APIs & Storage' },
    { id: 'data', title: 'Databases & TCP' }
  ];

  let html = '';
  if (currentCat === 'all' && !searchFilter) {
    for (const sec of sections) {
      const items = filtered.filter(s => s.cat === sec.id);
      if (items.length === 0) continue;
      html += `<div class="section-title">${sec.title}</div>`;
      html += `<div class="grid">${items.map(renderCard).join('')}</div>`;
    }
  } else {
    html = `<div class="grid">${filtered.map(renderCard).join('')}</div>`;
  }

  root.innerHTML = html;
}

function renderCard(s) {
  const h = healthMap[s.id] || { status: 'checking' };
  const isOnline = h.status === 'online';
  const dotClass = isOnline ? 'online' : (h.status === 'offline' ? 'offline' : '');

  if (s.isWeb) {
    return `
      <a href="${s.url}" target="_blank" rel="noopener" class="card" id="card-${s.id}">
        <div class="card-left">
          <div class="card-icon">${s.icon}</div>
          <div class="card-text">
            <div class="card-name">${s.name}</div>
            <div class="card-meta">${s.meta}</div>
          </div>
        </div>
        <div class="card-right">
          <span class="card-dot ${dotClass}" id="dot-${s.id}" title="${isOnline ? 'Online' : 'Checking'}"></span>
          <span class="card-action">↗</span>
        </div>
      </a>
    `;
  } else {
    const val = (s.copyVal || s.meta).replace(/'/g, "\\'");
    const msg = (s.copyMsg || 'Copied').replace(/'/g, "\\'");
    return `
      <div class="card" id="card-${s.id}" onclick="copy('${val}', '${msg}')" title="Click to copy connection command">
        <div class="card-left">
          <div class="card-icon">${s.icon}</div>
          <div class="card-text">
            <div class="card-name">${s.name}</div>
            <div class="card-meta">${s.meta}</div>
          </div>
        </div>
        <div class="card-right">
          <span class="card-dot ${dotClass}" id="dot-${s.id}" title="${isOnline ? 'Online' : 'Checking'}"></span>
          <span class="card-action">📋</span>
        </div>
      </div>
    `;
  }
}

// Search & Category Filters
function handleSearch() {
  searchFilter = document.getElementById('search-input').value;
  render();
}

function setCategory(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// Probing & Health
async function probeOne(service) {
  // If this is a TCP service without an HTTP probeApi or web URL, await telemetry if pending
  if (!service.probeApi && !service.isWeb) {
    if (!latestTcpServices || latestTcpServices[service.id] === undefined) {
      if (telemetryPromise) {
        try {
          await telemetryPromise;
        } catch (e) {}
      }
    }
    if (latestTcpServices && latestTcpServices[service.id] !== undefined) {
      return { status: latestTcpServices[service.id] ? 'online' : 'offline', latency: 1 };
    }
  }

  if (latestTcpServices && latestTcpServices[service.id] !== undefined) {
    return { status: latestTcpServices[service.id] ? 'online' : 'offline', latency: 1 };
  }

  if (service.probeApi) {
    const t0 = performance.now();
    const ctrl = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 4000);
    try {
      const res = await fetch(service.probeApi, { method: 'GET', cache: 'no-store', signal: ctrl.signal });
      clearTimeout(timeout);
      if (res.ok || res.status === 200 || res.status === 204 || res.status === 403) {
        return { status: 'online', latency: Math.max(1, Math.round(performance.now() - t0)) };
      }
    } catch (e) {
      clearTimeout(timeout);
    }
  }

  if (service.isWeb) {
    const t0 = performance.now();
    const ctrl = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 4000);
    try {
      await fetch(service.url, { method: 'GET', mode: 'no-cors', cache: 'no-store', signal: ctrl.signal });
      clearTimeout(timeout);
      return { status: 'online', latency: Math.max(1, Math.round(performance.now() - t0)) };
    } catch (e) {
      clearTimeout(timeout);
    }
  }

  const prev = healthMap[service.id];
  if (prev && prev.status === 'online' && !prev._failedOnce) {
    return { status: 'online', latency: prev.latency || 20, _failedOnce: true };
  }

  return { status: 'offline' };
}

async function probeAll() {
  const icon = document.getElementById('refresh-icon');
  if (icon) icon.style.animation = 'spin 0.8s linear infinite';
  isProbing = true;

  try {
    await Promise.all(SERVICES.map(async s => {
      const res = await probeOne(s);
      healthMap[s.id] = res;
      updateDot(s.id, res.status === 'online');
    }));
  } finally {
    isProbing = false;
    updateOverallStatus();
    if (icon) setTimeout(() => { icon.style.animation = ''; }, 400);
  }
}

function updateDot(id, isOnline) {
  const dot = document.getElementById(`dot-${id}`);
  if (!dot) return;
  dot.className = `card-dot ${isOnline ? 'online' : 'offline'}`;
}

// Telemetry Polling
async function fetchTelemetry() {
  if (document.visibilityState !== 'visible') return;
  try {
    const res = await fetch('/api/system', { cache: 'no-store' });
    if (!res.ok) return;
    const d = await res.json();
    if (d.tcp_services) {
      latestTcpServices = d.tcp_services;
      for (const [id, isUp] of Object.entries(d.tcp_services)) {
        healthMap[id] = { status: isUp ? 'online' : 'offline', latency: 1 };
        updateDot(id, isUp);
      }
      if (!isProbing) {
        updateOverallStatus();
      }
    }

    if (d.uptime_seconds !== undefined) {
      const el = document.getElementById('uptime-pill');
      if (el) {
        el.innerText = `Up: ${formatUptime(d.uptime_seconds)}`;
        const d_days = Math.floor(d.uptime_seconds / 86400);
        const d_hours = Math.floor((d.uptime_seconds % 86400) / 3600);
        const d_mins = Math.floor((d.uptime_seconds % 3600) / 60);
        el.title = `System Uptime: ${d_days}d ${d_hours}h ${d_mins}m`;
      }
    }

    if (d.cpu) {
      const el = document.getElementById('cpu-pill');
      if (el) el.innerText = `CPU: ${d.cpu.percent ? d.cpu.percent.toFixed(0) : 0}%`;
    }
    if (d.memory) {
      const el = document.getElementById('ram-pill');
      const gib = 1024 * 1024 * 1024;
      if (el && d.memory.used) {
        el.innerText = `RAM: ${(d.memory.used / gib).toFixed(1)}G`;
      }
    }
    if (d.disk) {
      const el = document.getElementById('disk-pill');
      if (el && d.disk.percent !== undefined) el.innerText = `Disk: ${d.disk.percent.toFixed(0)}%`;
    }
  } catch (e) {}
}

function formatUptime(seconds) {
  if (typeof seconds !== 'number' || seconds < 0) return '--';
  const d = Math.floor(seconds / 86400);
  const h = Math.floor((seconds % 86400) / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  if (d > 0) return `${d}d ${h}h`;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m`;
  return `${Math.floor(seconds)}s`;
}

function loadTelemetry() {
  telemetryPromise = fetchTelemetry();
  return telemetryPromise;
}

function refreshAll() {
  loadTelemetry();
  probeAll();
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('devbox_theme', next);
}

function copy(text, msg) {
  navigator.clipboard.writeText(text).then(() => showToast(msg || 'Copied'));
}

function showToast(msg) {
  const root = document.getElementById('toast-root');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerText = msg;
  root.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transition = 'opacity 0.2s ease';
    setTimeout(() => t.remove(), 200);
  }, 1800);
}

document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('search-input').focus();
  }
});

document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('devbox_theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);

  render();
  loadTelemetry();
  probeAll();

  setInterval(loadTelemetry, 3000);
  setInterval(probeAll, 15000);
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    refreshAll();
  }
});
</script>
